name: CarNoiseAI - Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          # sdkmanager exits successfully; 'yes' can receive SIGPIPE after
          # sdkmanager has consumed the answers. Disable pipefail for this
          # pipeline only so the step reflects sdkmanager's exit code.
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle and Java
        run: |
          java -version
          gradle --version

      - name: Clean and build APK
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Verify generated APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          sha256sum "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarNoiseAI-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
